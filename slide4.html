<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ATS Score</title>
<style>
  :root{
    --bg:#0B0E17; --line:#252B3B; --text:#F1F3F9; --muted:#8B93A7;
    --violet:#8B5CF6; --blue:#3B82F6; --teal:#14B8A6; --amber:#F59E0B;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;
    background:radial-gradient(circle at 75% 20%, #1B1440 0%, var(--bg) 55%);
    color:var(--text);font-family:'Segoe UI', Arial, sans-serif;
    display:flex;align-items:center;justify-content:center;padding:40px;
  }
  .wrap{width:100%;max-width:520px;}
  .step{font-size:12px;color:var(--muted);margin-bottom:8px;}
  h1{font-size:26px;margin:0 0 6px;font-weight:800;}
  h1 span{background:linear-gradient(90deg,var(--violet),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .sub{color:var(--muted);font-size:13px;margin:0 0 22px;line-height:1.5;}

  .card{background:#12162399;border:1px solid var(--line);border-radius:16px;padding:28px;}

  .score-row{display:flex;align-items:center;gap:22px;padding-bottom:22px;border-bottom:1px solid var(--line);margin-bottom:22px;flex-wrap:wrap;}
  .gauge{position:relative;width:120px;height:120px;flex-shrink:0;}
  .gauge svg{transform:rotate(-90deg);}
  .gauge-bg{fill:none;stroke:#1C2333;stroke-width:11;}
  .gauge-fill{fill:none;stroke-width:11;stroke-linecap:round;stroke:url(#gaugeGrad);transition:stroke-dashoffset 1.2s ease;}
  .gauge-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .gauge-num{font-size:24px;font-weight:800;}
  .gauge-sub{font-size:9px;color:var(--muted);letter-spacing:.5px;}
  .verdict-title{font-size:16px;font-weight:700;margin-bottom:4px;}
  .verdict-desc{font-size:12.5px;color:var(--muted);line-height:1.5;max-width:280px;}

  .section-label{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;margin-bottom:14px;}

  .cat-row{margin-bottom:14px;}
  .cat-row:last-child{margin-bottom:0;}
  .cat-top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px;}
  .cat-top .name{font-weight:600;}
  .cat-top .score{color:var(--muted);}
  .cat-bar-bg{background:#1C2333;height:5px;border-radius:4px;overflow:hidden;}
  .cat-bar-fill{height:100%;border-radius:4px;width:0%;transition:width 1s ease;background:linear-gradient(90deg,var(--violet),var(--blue));}

  .nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:20px;}
  button{
    font-family:inherit;font-size:14px;font-weight:700;border-radius:10px;
    padding:11px 22px;cursor:pointer;border:1px solid transparent;transition:.15s ease;
  }
  .btn-back{background:transparent;color:var(--muted);border-color:var(--line);}
  .btn-back:hover{background:#161B29;}
  .btn-next{background:linear-gradient(90deg,var(--violet),var(--blue));color:white;box-shadow:0 8px 24px rgba(59,130,246,.3);}
  .btn-next:hover{transform:translateY(-1px);}
</style>
</head>
<body>

<div class="wrap">
  <div class="step">Step 4 of 6</div>
  <h1>ATS <span>Compatibility Score</span></h1>
  <p class="sub">Estimates how well your resume matches common ATS parsing standards.</p>

  <div class="card">
    <div class="score-row">
      <div class="gauge">
        <svg width="120" height="120" viewBox="0 0 120 120">
          <defs>
            <linearGradient id="gaugeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#8B5CF6"/>
              <stop offset="100%" stop-color="#14B8A6"/>
            </linearGradient>
          </defs>
          <circle class="gauge-bg" cx="60" cy="60" r="51"/>
          <circle class="gauge-fill" id="gaugeFill" cx="60" cy="60" r="51" stroke-dasharray="320" stroke-dashoffset="320"/>
        </svg>
        <div class="gauge-center">
          <div class="gauge-num" id="scoreNum">0</div>
          <div class="gauge-sub">OUT OF 100</div>
        </div>
      </div>
      <div>
        <div class="verdict-title" id="verdictTitle"></div>
        <div class="verdict-desc" id="verdictDesc"></div>
      </div>
    </div>

    <div class="section-label">Score Breakdown</div>
    <div id="breakdownList"></div>
  </div>

  <div class="nav-row">
    <button class="btn-back" onclick="window.location.href='slide3.html'">← Back</button>
    <button class="btn-next" onclick="window.location.href='slide5.html'">Next →</button>
  </div>
</div>

<script>
  const stored = sessionStorage.getItem("resumeData");

  if(!stored){
    window.location.href = "index.html";
  } else {
    const data = JSON.parse(stored);
    const score = data.ats_score;
    const breakdown = data.ats_breakdown || [];

    const circumference = 2 * Math.PI * 51;
    const fill = document.getElementById('gaugeFill');
    const offset = circumference - (score/100)*circumference;

    document.getElementById('scoreNum').textContent = score;
    document.getElementById('verdictTitle').textContent = data.ats_verdict;
    document.getElementById('verdictDesc').textContent = data.ats_verdict_desc || "";

    document.getElementById('breakdownList').innerHTML = breakdown.map(b => {
      const max = b.max || 100;
      const pct = (b.value / max) * 100;
      return `
        <div class="cat-row">
          <div class="cat-top"><span class="name">${b.label}</span><span class="score">${b.value}/${max}</span></div>
          <div class="cat-bar-bg"><div class="cat-bar-fill" data-w="${pct}"></div></div>
        </div>`;
    }).join("");

    setTimeout(()=>{
      fill.style.strokeDashoffset = offset;
      document.querySelectorAll('.cat-bar-fill').forEach(b=>{
        b.style.width = b.dataset.w + "%";
      });
    }, 100);
  }
</script>

</body>
</html>
