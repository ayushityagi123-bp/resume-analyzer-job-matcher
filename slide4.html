<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ATS Score</title>
<style>
  :root{
    --bg:#0B0E17; --line:#252B3B; --text:#F1F3F9; --muted:#8B93A7;
    --violet:#8B5CF6; --blue:#3B82F6; --teal:#14B8A6; --amber:#F59E0B;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;
    background:radial-gradient(circle at 75% 20%, #1B1440 0%, var(--bg) 55%);
    color:var(--text);font-family:'Segoe UI', Arial, sans-serif;
    display:flex;align-items:center;justify-content:center;padding:40px;
  }
  .wrap{width:100%;max-width:520px;}
  .step{font-size:12px;color:var(--muted);margin-bottom:8px;}
  h1{font-size:26px;margin:0 0 6px;font-weight:800;}
  h1 span{background:linear-gradient(90deg,var(--violet),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .sub{color:var(--muted);font-size:14.5px;margin:0 0 24px;}

  .card{
    background:#12162399;border:1px solid var(--line);border-radius:16px;padding:28px;
  }

  .gauge-wrap{display:flex;flex-direction:column;align-items:center;margin-bottom:22px;}
  .gauge{position:relative;width:180px;height:180px;}
  .gauge svg{transform:rotate(-90deg);}
  .gauge-bg{fill:none;stroke:#1C2333;stroke-width:14;}
  .gauge-fill{
    fill:none;stroke-width:14;stroke-linecap:round;
    stroke:url(#gaugeGrad);
    transition:stroke-dashoffset 1.2s ease;
  }
  .gauge-center{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  .gauge-num{font-size:34px;font-weight:800;}
  .gauge-label{font-size:11px;color:var(--muted);}
  .verdict{margin-top:10px;font-size:14px;font-weight:700;color:var(--teal);}
  .verdict-sub{font-size:12.5px;color:var(--muted);text-align:center;max-width:320px;}

  .breakdown{margin-top:18px;border-top:1px solid var(--line);padding-top:18px;}
  .row{margin-bottom:12px;}
  .row:last-child{margin-bottom:0;}
  .row-label{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px;}
  .row-label span:last-child{color:var(--muted);}
  .bar-bg{background:#1C2333;height:6px;border-radius:4px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--violet),var(--blue));width:0%;transition:width 1s ease;}

  .nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:24px;}
  button{
    font-family:inherit;font-size:14px;font-weight:700;border-radius:10px;
    padding:11px 22px;cursor:pointer;border:1px solid transparent;transition:.15s ease;
  }
  .btn-back{background:transparent;color:var(--muted);border-color:var(--line);}
  .btn-back:hover{background:#161B29;}
  .btn-next{background:linear-gradient(90deg,var(--violet),var(--blue));color:white;box-shadow:0 8px 24px rgba(59,130,246,.3);}
  .btn-next:hover{transform:translateY(-1px);}
</style>
</head>
<body>

<div class="wrap">
  <div class="step">Step 4 of 6</div>
  <h1>ATS <span>Score</span></h1>
  <p class="sub">Your resume performance against Applicant Tracking Systems.</p>

  <div class="card">
    <div class="gauge-wrap">
      <div class="gauge">
        <svg width="180" height="180" viewBox="0 0 180 180">
          <defs>
            <linearGradient id="gaugeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#8B5CF6"/>
              <stop offset="100%" stop-color="#14B8A6"/>
            </linearGradient>
          </defs>
          <circle class="gauge-bg" cx="90" cy="90" r="78"/>
          <circle class="gauge-fill" id="gaugeFill" cx="90" cy="90" r="78"
            stroke-dasharray="490" stroke-dashoffset="490"/>
        </svg>
        <div class="gauge-center">
          <div class="gauge-num" id="scoreNum">0%</div>
          <div class="gauge-label">ATS SCORE</div>
        </div>
      </div>
      <div class="verdict" id="verdictText"></div>
      <div class="verdict-sub">Your resume is well optimized for Applicant Tracking Systems.</div>
    </div>

    <div class="breakdown" id="breakdown"></div>
  </div>

  <div class="nav-row">
    <button class="btn-back" onclick="window.location.href='slide3.html'">← Back</button>
    <button class="btn-next" onclick="window.location.href='slide5.html'">Next →</button>
  </div>
</div>

<script>
  // Placeholder — real score will come from backend logic later
  const score = 78;
  const breakdown = [
    {label:"Content Quality", value:85},
    {label:"Skills Match", value:75},
    {label:"Keyword Usage", value:80},
    {label:"Formatting", value:70}
  ];

  const circumference = 2 * Math.PI * 78;
  const fill = document.getElementById('gaugeFill');
  const offset = circumference - (score/100)*circumference;

  document.getElementById('scoreNum').textContent = score + "%";
  document.getElementById('verdictText').textContent =
    score >= 80 ? "Excellent Score! 🎯" :
    score >= 60 ? "Good Score! 👍" : "Needs Improvement";

  const bdBox = document.getElementById('breakdown');
  bdBox.innerHTML = breakdown.map(b => `
    <div class="row">
      <div class="row-label"><span>${b.label}</span><span>${b.value}%</span></div>
      <div class="bar-bg"><div class="bar-fill" data-w="${b.value}"></div></div>
    </div>
  `).join("");

  // animate after paint
  setTimeout(()=>{
    fill.style.strokeDashoffset = offset;
    document.querySelectorAll('.bar-fill').forEach(b=>{
      b.style.width = b.dataset.w + "%";
    });
  }, 100);
</script>

</body>
</html>
