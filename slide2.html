<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Resume Uploaded</title>
<style>
  :root{
    --bg:#0B0E17; --line:#252B3B; --text:#F1F3F9; --muted:#8B93A7;
    --violet:#8B5CF6; --blue:#3B82F6; --teal:#14B8A6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;
    background:radial-gradient(circle at 75% 20%, #1B1440 0%, var(--bg) 55%);
    color:var(--text);font-family:'Segoe UI', Arial, sans-serif;
    display:flex;align-items:center;justify-content:center;padding:40px;
  }
  .wrap{width:100%;max-width:520px;}
  .step{font-size:12px;color:var(--muted);margin-bottom:8px;}
  h1{font-size:26px;margin:0 0 6px;font-weight:800;}
  h1 span{background:linear-gradient(90deg,var(--violet),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .sub{color:var(--muted);font-size:14.5px;margin:0 0 28px;}

  .card{
    background:#12162399;border:1px solid var(--line);border-radius:16px;
    padding:28px;text-align:center;
  }
  .tick{
    width:56px;height:56px;margin:0 auto 16px;border-radius:50%;
    background:linear-gradient(135deg,var(--teal),var(--blue));
    display:flex;align-items:center;justify-content:center;
  }
  .tick svg{width:26px;height:26px;stroke:white;}
  .name{font-size:19px;font-weight:700;margin:0 0 2px;}
  .contact{font-size:13px;color:var(--muted);margin:0 0 18px;}

  .preview{
    background:#0E1220;border:1px solid var(--line);border-radius:10px;
    padding:14px 16px;text-align:left;font-size:12.5px;color:#9AA2B4;
    line-height:1.6;position:relative;overflow:hidden;max-height:70px;
  }
  .preview::after{
    content:'';position:absolute;bottom:0;left:0;right:0;height:36px;
    background:linear-gradient(transparent, #0E1220);
  }
  .filemeta{
    display:flex;justify-content:center;gap:16px;margin-top:16px;
    font-size:12px;color:var(--muted);
  }
  .filemeta span{display:flex;align-items:center;gap:5px;}

  .nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:26px;}
  button{
    font-family:inherit;font-size:14px;font-weight:700;border-radius:10px;
    padding:11px 22px;cursor:pointer;border:1px solid transparent;transition:.15s ease;
  }
  .btn-back{background:transparent;color:var(--muted);border-color:var(--line);}
  .btn-back:hover{background:#161B29;}
  .btn-next{background:linear-gradient(90deg,var(--violet),var(--blue));color:white;box-shadow:0 8px 24px rgba(59,130,246,.3);}
  .btn-next:hover{transform:translateY(-1px);}
</style>
</head>
<body>

<div class="wrap">
  <div class="step">Step 2 of 6</div>
  <h1>Resume <span>Uploaded</span></h1>
  <p class="sub">We found your resume. Here's a quick look before we analyze it.</p>

  <div class="card">
    <div class="tick">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
    </div>
    <div class="name" id="pName">Loading…</div>
    <div class="contact" id="pContact"></div>

    <div class="preview" id="pPreview">Reading file…</div>

    <div class="filemeta">
      <span>📄 <span id="pFile">resume.pdf</span></span>
      <span>·</span>
      <span id="pPages">1 page</span>
    </div>
  </div>

  <div class="nav-row">
    <button class="btn-back" onclick="window.location.href='index.html'">← Back</button>
    <button class="btn-next" onclick="window.location.href='slide3.html'">Next →</button>
  </div>
</div>

<script>
  // Read the real data that index.html saved after a successful upload
  const stored = sessionStorage.getItem("resumeData");

  if(!stored){
    // No resume was uploaded — send the user back to slide 1
    window.location.href = "index.html";
  } else {
    const data = JSON.parse(stored);
    const text = data.extracted_text || "";

    const firstLine = text.split("\n").find(l => l.trim().length > 0) || "Resume";
    const emailMatch = text.match(/[\w.+-]+@[\w-]+\.[\w.-]+/);
    const phoneMatch = text.match(/\+?\d[\d\s-]{8,}\d/);

    const contactParts = [];
    if(phoneMatch) contactParts.push(phoneMatch[0].trim());
    if(emailMatch) contactParts.push(emailMatch[0]);

    document.getElementById('pName').textContent = firstLine.trim();
    document.getElementById('pContact').textContent = contactParts.join(" · ") || "Contact details not found";
    document.getElementById('pPreview').textContent = text.slice(0, 220) + (text.length > 220 ? "..." : "");
    document.getElementById('pFile').textContent = data.filename;
    document.getElementById('pPages').textContent = data.pages + (data.pages === 1 ? " page" : " pages");
  }
</script>

</body>
</html>
