<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Missing Skills & Recommendations</title>
<style>
  :root{
    --bg:#0B0E17; --line:#252B3B; --text:#F1F3F9; --muted:#8B93A7;
    --violet:#8B5CF6; --blue:#3B82F6; --teal:#14B8A6; --amber:#F59E0B; --red:#EF4444;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;
    background:radial-gradient(circle at 75% 20%, #1B1440 0%, var(--bg) 55%);
    color:var(--text);font-family:'Segoe UI', Arial, sans-serif;
    display:flex;align-items:center;justify-content:center;padding:40px;
  }
  .wrap{width:100%;max-width:560px;}
  .step{font-size:12px;color:var(--muted);margin-bottom:8px;}
  h1{font-size:26px;margin:0 0 6px;font-weight:800;}
  h1 span{background:linear-gradient(90deg,var(--violet),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .sub{color:var(--muted);font-size:14.5px;margin:0 0 22px;}

  .card{background:#12162399;border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:14px;}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
  .card-head .icon{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;}
  .card-head .icon svg{width:14px;height:14px;stroke:white;}
  .card-head h3{margin:0;font-size:14px;}
  .icon.missing{background:linear-gradient(135deg,var(--red),var(--amber));}
  .icon.good{background:linear-gradient(135deg,var(--teal),var(--blue));}
  .icon.tip{background:linear-gradient(135deg,var(--amber),var(--violet));}

  .tags{display:flex;flex-wrap:wrap;gap:6px;}
  .tag{font-size:11.5px;padding:5px 10px;border-radius:20px;}
  .tag.missing{background:#3A1414;color:#FCA5A5;border:1px solid #5A2020;}
  .tag.good{background:#0F3D3A;color:var(--teal);border:1px solid #164E4A;}

  .tip-box{
    background:#1A1508;border:1px solid #3A2E0D;border-radius:10px;
    padding:12px 14px;font-size:12.5px;color:#F0D89C;line-height:1.5;
  }

  .nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:20px;}
  button{
    font-family:inherit;font-size:14px;font-weight:700;border-radius:10px;
    padding:11px 22px;cursor:pointer;border:1px solid transparent;transition:.15s ease;
  }
  .btn-back{background:transparent;color:var(--muted);border-color:var(--line);}
  .btn-back:hover{background:#161B29;}
  .btn-restart{background:linear-gradient(90deg,var(--violet),var(--blue));color:white;box-shadow:0 8px 24px rgba(59,130,246,.3);}
  .btn-restart:hover{transform:translateY(-1px);}
</style>
</head>
<body>

<div class="wrap">
  <div class="step">Step 6 of 6</div>
  <h1>Missing Skills & <span>Recommendations</span></h1>
  <p class="sub">Improve your skills to get better opportunities.</p>

  <div class="card">
    <div class="card-head">
      <div class="icon missing">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </div>
      <h3>Missing Skills</h3>
    </div>
    <div class="tags" id="missingBox"></div>
  </div>

  <div class="card">
    <div class="card-head">
      <div class="icon good">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
      </div>
      <h3>Recommended For You</h3>
    </div>
    <div class="tags" id="goodBox"></div>
  </div>

  <div class="card">
    <div class="card-head">
      <div class="icon tip">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a6 6 0 0 0-3 11c.6.5 1 1.2 1 2h4c0-.8.4-1.5 1-2a6 6 0 0 0-3-11z"/></svg>
      </div>
      <h3>Tip</h3>
    </div>
    <div class="tip-box" id="tipBox"></div>
  </div>

  <div class="nav-row">
    <button class="btn-back" onclick="window.location.href='slide5.html'">← Back</button>
    <button class="btn-restart" onclick="window.location.href='index.html'">Start Over ↻</button>
  </div>
</div>

<script>
  // Placeholder — real gaps will come from backend job/skill comparison later
  const missing = ["Power BI","Tableau","Excel (Advanced)","Statistics"];
  const recommended = ["Learn Power BI for Data Visualization","Improve Excel skills","Explore Statistics & Probability"];
  const tip = "Adding these skills to your resume can significantly improve your ATS score and job match percentage.";

  document.getElementById('missingBox').innerHTML =
    missing.map(s => `<span class="tag missing">✕ ${s}</span>`).join("");

  document.getElementById('goodBox').innerHTML =
    recommended.map(s => `<span class="tag good">${s}</span>`).join("");

  document.getElementById('tipBox').textContent = tip;
</script>

</body>
</html>
