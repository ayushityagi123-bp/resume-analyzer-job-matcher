<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Job Matches</title>
<style>
  :root{
    --bg:#0B0E17; --line:#252B3B; --text:#F1F3F9; --muted:#8B93A7;
    --violet:#8B5CF6; --blue:#3B82F6; --teal:#14B8A6; --amber:#F59E0B;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;
    background:radial-gradient(circle at 75% 20%, #1B1440 0%, var(--bg) 55%);
    color:var(--text);font-family:'Segoe UI', Arial, sans-serif;
    display:flex;align-items:center;justify-content:center;padding:40px;
  }
  .wrap{width:100%;max-width:600px;}
  .step{font-size:12px;color:var(--muted);margin-bottom:8px;}
  h1{font-size:26px;margin:0 0 6px;font-weight:800;}
  h1 span{background:linear-gradient(90deg,var(--violet),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .sub{color:var(--muted);font-size:14.5px;margin:0 0 22px;}

  .list{display:flex;flex-direction:column;gap:12px;max-height:420px;overflow-y:auto;padding-right:4px;}

  .job{
    background:#12162399;border:1px solid var(--line);border-radius:14px;
    padding:16px 18px;display:flex;align-items:center;gap:14px;
  }
  .job-icon{
    width:42px;height:42px;border-radius:10px;flex-shrink:0;
    background:linear-gradient(135deg,var(--violet),var(--blue));
    display:flex;align-items:center;justify-content:center;
  }
  .job-icon svg{width:20px;height:20px;stroke:white;}
  .job-info{flex:1;min-width:0;}
  .job-title{font-size:14px;font-weight:700;margin:0 0 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .job-company{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .job-right{text-align:right;flex-shrink:0;}
  .match{
    font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:20px;margin-bottom:8px;display:inline-block;
  }
  .match.high{background:#0F3D3A;color:var(--teal);}
  .match.mid{background:#2A2A0F;color:var(--amber);}
  .apply{
    display:block;font-size:11.5px;font-weight:700;color:white;
    background:linear-gradient(90deg,var(--violet),var(--blue));
    padding:6px 12px;border-radius:8px;text-decoration:none;
  }

  .state-box{
    text-align:center;padding:50px 20px;color:var(--muted);font-size:13px;
  }
  .spinner{
    width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--violet);
    border-radius:50%;margin:0 auto 14px;animation:spin 0.8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:20px;}
  button{
    font-family:inherit;font-size:14px;font-weight:700;border-radius:10px;
    padding:11px 22px;cursor:pointer;border:1px solid transparent;transition:.15s ease;
  }
  .btn-back{background:transparent;color:var(--muted);border-color:var(--line);}
  .btn-back:hover{background:#161B29;}
  .btn-next{background:linear-gradient(90deg,var(--violet),var(--blue));color:white;box-shadow:0 8px 24px rgba(59,130,246,.3);}
  .btn-next:hover{transform:translateY(-1px);}
</style>
</head>
<body>

<div class="wrap">
  <div class="step">Step 5 of 6</div>
  <h1>Job <span>Matches</span> For You</h1>
  <p class="sub" id="subText">Top job opportunities based on your profile.</p>

  <div class="list" id="jobList">
    <div class="state-box">
      <div class="spinner"></div>
      Fetching live job listings...
    </div>
  </div>

  <div class="nav-row">
    <button class="btn-back" onclick="window.location.href='slide4.html'">← Back</button>
    <button class="btn-next" onclick="window.location.href='slide6.html'">Next →</button>
  </div>
</div>

<script>
  const BACKEND_URL = "http://127.0.0.1:8000";
  const stored = sessionStorage.getItem("resumeData");

  if(!stored){
    window.location.href = "index.html";
  } else {
    const data = JSON.parse(stored);
    const skills = data.skills || [];
    const jobList = document.getElementById('jobList');

    if(skills.length === 0){
      jobList.innerHTML = `<div class="state-box">No skills were detected in your resume, so we couldn't search for matching jobs.</div>`;
    } else {
      fetch(BACKEND_URL + "/job-matches?skills=" + encodeURIComponent(skills.join(",")))
        .then(res => res.json().then(body => ({ ok: res.ok, body })))
        .then(({ ok, body }) => {
          if(!ok){
            jobList.innerHTML = `<div class="state-box">⚠ ${body.detail || "Could not fetch job listings."}</div>`;
            return;
          }

          const jobs = body.jobs || [];
          sessionStorage.setItem("jobMatches", JSON.stringify(jobs));

          document.getElementById('subText').textContent =
            `Found ${body.total_found} live openings — showing your top ${jobs.length} matches.`;

          if(jobs.length === 0){
            jobList.innerHTML = `<div class="state-box">No matching jobs found right now. Try again later.</div>`;
            return;
          }

          jobList.innerHTML = jobs.map(j => `
            <div class="job">
              <div class="job-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
              </div>
              <div class="job-info">
                <div class="job-title">${j.title}</div>
                <div class="job-company">${j.company} · ${j.location}</div>
              </div>
              <div class="job-right">
                <div class="match ${j.match>=80?'high':'mid'}">${j.match}% Match</div>
                <a class="apply" href="${j.link}" target="_blank" rel="noopener">Apply Now →</a>
              </div>
            </div>
          `).join("");
        })
        .catch(() => {
          jobList.innerHTML = `<div class="state-box">⚠ Could not connect to the server. Make sure the backend is running.</div>`;
        });
    }
  }
</script>

</body>
</html>
